<!doctype html>
<html lang="en" data-theme="auto" data-wallpaper="paper">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Odysseus OS</title>
  <link rel="icon" href="/static/icons/icon-192.png">
  <link rel="preload" href="/static/os/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/os/fonts/instrument-serif-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/os/os.css">
  <link rel="stylesheet" href="/static/os/apps.css">
  <link rel="stylesheet" href="/static/os/jarvis.css">
  <link rel="stylesheet" href="/static/os/models.css">
  <link rel="stylesheet" href="/static/os/automations.css">
  <link rel="stylesheet" href="/static/os/dashboard.css">
  <link rel="stylesheet" href="/static/os/net.css">
  <!-- Apply the saved theme before first paint so there is no flash. -->
  <script nonce="{{CSP_NONCE}}">
    try { var t = localStorage.getItem('ody.os.theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div id="boot" role="status" aria-live="polite">
    <div class="boot-card">
      <div class="boot-mark serif">Odysseus<em> OS</em></div>
      <h1 class="boot-title">Starting up…</h1>
    </div>
  </div>
  <div id="desktop" hidden></div>
  <div id="overlays"></div>
  <noscript><p style="padding:2rem;font-family:sans-serif">Odysseus OS needs JavaScript.</p></noscript>
  <script type="module" src="/static/os/js/main.js"></script>
</body>
</html>
